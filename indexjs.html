<!doctype html>
<html>
  <head>
    <title>JavaScript practice</title>
    <meta charset="UTF-8" />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>

  <body class="container py-4">
    <h1>Lista de clientes</h1>
    <hr />
    <button
      type="button"
      class="btn btn-primary mb-2"
      data-bs-toggle="modal"
      data-bs-target="#AddClientModal"
    >
      Agregar cliente
    </button>
    <div id="app"></div>
    <div
      class="modal fade"
      id="AddClientModal"
      data-bs-backdrop="static"
      data-bs-keyboard="false"
      tabindex="-1"
      aria-labelledby="staticBackdropLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="staticBackdropLabel  ">
              Agregar o editar cliente
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="form-group mb-3">
              <label for="nombreInput" class="form-label">Nombre:</label>
              <input
                type="text"
                class="form-control"
                id="nombreInput"
                placeholder="Ingrese el nombre"
              />
            </div>
            <div class="form-group mb-3">
              <label for="apellidoInput" class="form-label">Apellido:</label>
              <input
                type="text"
                class="form-control"
                id="apellidoInput"
                placeholder="Ingrese el apellido"
              />
            </div>
            <div class="form-group mb-3">
              <label for="dniInput" class="form-label">DNI:</label>
              <input
                type="text"
                class="form-control"
                id="dniInput"
                placeholder="Ingrese el DNI"
              />
            </div>
            <div class="form-group mb-3">
              <label for="direccionInput" class="form-label">Dirección:</label>
              <input
                type="text"
                class="form-control"
                id="direccionInput"
                placeholder="Ingrese la dirección"
              />
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cerrar
            </button>
            <button type="button" id="btnAdd" class="btn btn-primary" data-bs>
              Guardar cambios
            </button>
          </div>
        </div>
      </div>
    </div>
    <script src="./js/code.js" type="module"></script>
    <script src="./js/supabase.js" type="module"></script>
  </body>
</html>
